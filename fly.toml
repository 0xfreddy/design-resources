app = "design-resources"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "4173"
  STACKS_FILE = "/data/stacks.json"

[[mounts]]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 4173
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/"
    timeout = "5s"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
